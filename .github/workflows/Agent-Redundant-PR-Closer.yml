name: Agent Redundant PR Closer

# Closes redundant and duplicate agent PRs by priority.
# Calls the reusable workflow in Repository_Management.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, closed]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Detect only, don't close"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      agent_filter:
        description: "Comma-separated agent ids eligible to close"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: jules-redundant-pr-closer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  close-redundant:
    uses: D-sorganization/Repository_Management/.github/workflows/reusable-redundant-pr-closer.yml@main
    with:
      dry_run: ${{ inputs.dry_run || 'false' }}
      agent_filter: ${{ inputs.agent_filter || '' }}
      repo_name: ${{ github.event.repository.name }}
    secrets: inherit
